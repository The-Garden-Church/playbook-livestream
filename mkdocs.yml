site_name: TGC - Livestream Playbook
site_description: Everything the Livestream Team needs to recruit, train, and run a great weekend.
site_url: https://the-garden-church.github.io/playbook-livestream
repo_url: https://github.com/The-Garden-Church/playbook-livestream
repo_name: The-Garden-Church/playbook-livestream

extra:
  generator: false

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.webp
  favicon: assets/logo.webp
  font:
    text: Montserrat
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: black
      accent: white
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/interactive-checklists.js
  - javascripts/figure-embeds.js

plugins:
  - search

exclude_docs: |
  tools/**/*.test.mjs
  tools/**/package.json
  tools/**/make-placeholder.mjs
  tools/**/README.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - attr_list
  - toc:
      permalink: true
      toc_depth: 2

nav:
  - Home: index.md
  - Our Why: our-why.md
  - Join the Team: recruitment.md
  - Expectations: expectations.md
  - Weekend Process:
    - Overview: weekend-process/index.md
    - Pre-Service Checklist: weekend-process/pre-service.md
    - During Service: weekend-process/during-service.md
    - Post-Service Checklist: weekend-process/post-service.md
    - Troubleshooting: weekend-process/troubleshooting.md
  - Hardware: hardware.md
  - Training:
    - Onboarding: training/onboarding.md
    - Camera Basics:
      - training/camera-basics/index.md
      - Aperture: training/camera-basics/aperture.md
      - Shutter: training/camera-basics/shutter.md
      - ISO and Gain: training/camera-basics/iso.md
      - White Balance and Tint: training/camera-basics/white-balance.md
      - Zoom and Focus: training/camera-basics/focus-and-zoom.md
      - Dialing In Your Camera: training/camera-basics/dial-in.md
      - 'Practice: Dial In the Shot': training/camera-basics/practice.md
    - Role-Specific Guides: training/roles.md
    - Glossary: training/glossary.md
  - Credentials: credentials.md
  - Feedback: feedback.md
